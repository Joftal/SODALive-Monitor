name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.8.7, 不需要 v 前缀)'
        required: true
        type: string

# 禁止并发发版: 防止两个 bump job 同时 push 导致 fast-forward 失败与产物互踩
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 版本提升收口在单一 job: 三平台同时 commit 会互踩, package.json 是唯一版本源
  bump:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate version input
        shell: bash
        run: |
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::版本号格式必须是 x.y.z"; exit 1; }
      # npm version 遇"目标=当前"会硬失败; 重跑同版本发版(如修 Release Notes)必须幂等
      - name: Bump version
        shell: bash
        run: |
          current=$(node -p "require('./package.json').version")
          if [ "$current" = "${{ inputs.version }}" ]; then
            echo "版本号已是 ${{ inputs.version }}, 跳过 bump"
          else
            npm version "${{ inputs.version }}" --no-git-tag-version
          fi
      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release v${{ inputs.version }}"
            git push origin HEAD:main
          fi

  package:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder: '--win --x64'
            # glob 用空格、finalize 表格用点号, 不是笔误: ${productName} 只过 sanitizeFileName(内部空格保留),
            # 磁盘上是 "SODALive Monitor-Setup-x.y.z.exe"; 而 Releases 上的资产名是点号形态(v1.0.5~1.0.7 实测)。
            # 哪天 Windows 资产缺了, 先核对这两侧是否还对得上, 别急着把其中一侧改成另一侧的样子
            relfiles: |
              release/SODALive Monitor-Setup-*.exe
              release/SODALive Monitor-Portable-*.exe
          - os: macos-latest
            builder: '--mac --x64 --arm64'
            relfiles: |
              release/*.dmg
              release/*.zip
          - os: ubuntu-latest
            builder: '--linux --x64'
            relfiles: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main # 必须取 bump 之后的最新的 main(bump 提交), 否则产物版本号落后 Release 一位

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # appimagetool 自身以 AppImage 形态分发, 运行需要 FUSE 1; ubuntu-24.04 不再预装
      - name: Install FUSE (linux AppImage build)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      # 兜底重跑: npm ci 默认会执行依赖的 postinstall(ignore-scripts=false), 这三步在正常流程里是幂等空转;
      # 只有 runner 上配了 ignore-scripts 时它们才是必需的 —— 缺二进制时 electron-builder 的报错更难查, 留着划算
      - name: Re-run binary postinstall scripts
        run: |
          node node_modules/esbuild/install.js
          node node_modules/ffmpeg-static/install.js
          node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      # 行为回归链(12 套)不在打包流水线上跑: 它是 CI(ci.yml)的职责, 发版是从 main 切的,
      # main 不绿本来就不该发。这里再跑三遍只是把同一个红点抄三次, 还会让"哪份产物坏了"
      # 和"哪条契约断了"混进同一次失败里。typecheck 留着是因为 build 不查它, 编译面出错要在这一趟响。

      - name: Build app bundle
        run: npm run build

      # 图标主资源是提交在库的 resources/icon.ico(用户设计); CI 仅派生 png/icns
      - name: Derive icon assets (png/icns from committed ico)
        run: node scripts/icon-build.mjs

      - name: Package (${{ matrix.os }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # 免签名分发
        run: npx electron-builder ${{ matrix.builder }} --publish never

      # 同一 tag 追加各平台产物(action-gh-release 对已存在 Release 幂等追加)
      # 注意: 这里绝不生成 notes —— 三个 job 各生成一次会造成 Full Changelog 重复 ×3
      - name: Upload to Release (${{ matrix.os }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: SODALive Monitor v${{ inputs.version }}
          target_commitish: main
          draft: false
          prerelease: false
          generate_release_notes: false
          files: ${{ matrix.relfiles }}

  # 收口: 三平台产物齐了之后, 一次性写入 Asset Guide 表格 + 自动生成 Changelog(各一次, 绝不重复)
  finalize:
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Finalize release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: SODALive Monitor v${{ inputs.version }}
          target_commitish: main
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 📥 下载安装(点击文件名直接下载)

            | 文件(可点击) | 平台 | 说明 |
            |---|---|---|
            | [SODALive Monitor-Setup-${{ inputs.version }}.exe](https://github.com/Joftal/pd-monitor/releases/download/v${{ inputs.version }}/SODALive.Monitor-Setup-${{ inputs.version }}.exe) | Windows x64 | NSIS 安装包(推荐, 自动创建桌面快捷方式) |
            | [SODALive Monitor-Portable-${{ inputs.version }}.exe](https://github.com/Joftal/pd-monitor/releases/download/v${{ inputs.version }}/SODALive.Monitor-Portable-${{ inputs.version }}.exe) | Windows x64 | 便携免安装版, 数据随程序目录迁移 |
            | [SODALive Monitor-${{ inputs.version }}-x64.dmg](https://github.com/Joftal/pd-monitor/releases/download/v${{ inputs.version }}/SODALive.Monitor-${{ inputs.version }}-x64.dmg) | macOS Intel | DMG 安装包(免签名分发: 首次请右键 → 打开) |
            | [SODALive Monitor-${{ inputs.version }}-arm64.dmg](https://github.com/Joftal/pd-monitor/releases/download/v${{ inputs.version }}/SODALive.Monitor-${{ inputs.version }}-arm64.dmg) | macOS Apple Silicon(M 系列) | DMG 安装包(免签名分发: 首次请右键 → 打开) |
            | [SODALive Monitor-${{ inputs.version }}-x64.zip](https://github.com/Joftal/pd-monitor/releases/download/v${{ inputs.version }}/SODALive.Monitor-${{ inputs.version }}-x64.zip) | macOS Intel | ZIP 免安装版(同上, 右键打开) |
            | [SODALive Monitor-${{ inputs.version }}-arm64.zip](https://github.com/Joftal/pd-monitor/releases/download/v${{ inputs.version }}/SODALive.Monitor-${{ inputs.version }}-arm64.zip) | macOS Apple Silicon(M 系列) | ZIP 免安装版(同上, 右键打开) |
            | [SODALive Monitor-${{ inputs.version }}-x86_64.AppImage](https://github.com/Joftal/pd-monitor/releases/download/v${{ inputs.version }}/SODALive.Monitor-${{ inputs.version }}-x86_64.AppImage) | Linux x64 | 免安装, `chmod +x` 直接运行 |
            | [SODALive Monitor-${{ inputs.version }}-amd64.deb](https://github.com/Joftal/pd-monitor/releases/download/v${{ inputs.version }}/SODALive.Monitor-${{ inputs.version }}-amd64.deb) | Linux x64 | 安装包(依赖 `libsecret-1-0`, 安装器自动处理) |

            **数据位置**: Windows = 程序所在目录(data/ + electron-data/ + recording/, 安装版与便携版统一, 整体目录可备份迁移); macOS = `~/Library/Application Support/`; Linux = `~/.config/`
