appId: com.kbj.pandalivemonitor
productName: SODALive Monitor
copyright: Copyright © 2026
directories:
  output: release
# 打包期拉 electron 二进制的镜像(与 npm 无关: .npmrc 的未知键在 npm 12 起不再传递给 postinstall)
# 实测该前缀下的 <version>/electron-v<version>-<platform>-<arch>.zip 直接 200, 不经 302
electronDownload:
  mirror: https://cdn.npmmirror.com/binaries/electron/
# mac 产物 ad-hoc 深签名(脚本内自判平台, win/linux 直接跳过):
# 无任何签名的 .app 被浏览器下载隔离后会被 Gatekeeper 判"已损坏"; ad-hoc 自洽签名消除该判定
afterPack: scripts/adhoc-sign-mac.js
files:
  - out/**
  - package.json
  - resources/icon.png
  - node_modules/ffmpeg-static/**
asarUnpack:
  - '**/node_modules/ffmpeg-static/**'
extraResources:
  - from: resources/icon.png
    to: icon.png
win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: SODALive Monitor
  createDesktopShortcut: true
  artifactName: '${productName}-Setup-${version}.${ext}'
portable:
  artifactName: '${productName}-Portable-${version}.${ext}'
# mac: 免证书分发(afterPack 钩子做 ad-hoc 签名, 无需 Apple 开发者账号; 首次打开说明见 README)
mac:
  target:
    - dmg
    - zip
  icon: resources/icon.icns
  category: public.app-category.utilities
  artifactName: '${productName}-${version}-${arch}.${ext}'
  # 菜单栏 template 图仅进 mac 包(win/linux 不需要); @2x 由 createFromPath 自动识别为 Retina 表示
  extraResources:
    - from: resources/trayTemplate.png
      to: trayTemplate.png
    - from: resources/trayTemplate@2x.png
      to: trayTemplate@2x.png
# linux: AppImage(免安装) + deb(带 libsecret 依赖保证 Cookie 加密可用)
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Utility
  maintainer: Joftal # deb 需要维护者元数据(否则 FpmTarget 构建失败)
  artifactName: '${productName}-${version}-${arch}.${ext}'
deb:
  depends:
    - libsecret-1-0
